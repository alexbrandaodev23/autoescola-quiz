<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
  <title>Administració</title>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Autoescola Pedralbes</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Joc</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="admin.html">Administració</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">

        <h1 class="text-center mb-4">Administració de preguntes</h1>

        <div class="card mb-4">
          <div class="card-body">
            <h2 id="titolForm" class="h4">Nova pregunta</h2>

            <form id="formPregunta">
              <label for="inputPregunta" class="form-label">Pregunta</label>
              <input type="text" id="inputPregunta" class="form-control mb-3" required>

              <label for="inputImatge" class="form-label">Imatge</label>
              <input type="file" id="inputImatge" accept="image/*" class="form-control">
              <p id="imatgeActual" class="form-text mb-3"></p>

              <p class="form-label mb-1">Respostes (marca la correcta)</p>

              <div class="input-group mb-2">
                <div class="input-group-text">
                  <input type="radio" name="correcta" value="0" checked>
                </div>
                <input type="text" id="resp0" class="form-control" placeholder="Resposta 1" required>
              </div>
              <div class="input-group mb-2">
                <div class="input-group-text">
                  <input type="radio" name="correcta" value="1">
                </div>
                <input type="text" id="resp1" class="form-control" placeholder="Resposta 2" required>
              </div>
              <div class="input-group mb-2">
                <div class="input-group-text">
                  <input type="radio" name="correcta" value="2">
                </div>
                <input type="text" id="resp2" class="form-control" placeholder="Resposta 3" required>
              </div>
              <div class="input-group mb-3">
                <div class="input-group-text">
                  <input type="radio" name="correcta" value="3">
                </div>
                <input type="text" id="resp3" class="form-control" placeholder="Resposta 4" required>
              </div>

              <button type="submit" class="btn btn-primary">Guardar</button>
              <button type="button" id="btnCancelar" class="btn btn-outline-secondary hidden">Cancel·lar</button>
            </form>
          </div>
        </div>

        <p id="missatgeAdmin" class="text-center fw-bold"></p>

        <h2 class="h4">Preguntes existents</h2>
        <div id="llista"></div>

      </div>
    </div>
  </div>

  <script src="admin.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
